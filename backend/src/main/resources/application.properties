spring.application.name=backend
# Cấu hình kết nối SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=fashion_shop;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server port
server.port=8080

# App URLs
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.payment-result-url=${APP_PAYMENT_RESULT_URL:http://localhost:5173/#/payment-result}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Upload ảnh sản phẩm
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# VNPay Configuration (demo mode - set demo-mode=false and provide real credentials for live payments)
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO0001}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMOSECRETKEY12345678901234567890}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
vnpay.demo-mode=${VNPAY_DEMO_MODE:true}
jwt.secret=${JWT_SECRET:zestia-fashion-secret-key-datn-fpt-polytechnic-2025}
app.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}

# MoMo / ZaloPay sandbox credentials
payment.momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
payment.zalopay.app-id=${ZALOPAY_APP_ID:2553}
payment.zalopay.key1=${ZALOPAY_KEY1:}
payment.zalopay.key2=${ZALOPAY_KEY2:}
payment.zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}

# OpenAI customer-support chat
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.endpoint=${OPENAI_ENDPOINT:https://api.openai.com/v1/responses}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}

# =========================
# Mail (Gmail)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
