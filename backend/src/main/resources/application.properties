# =========================
# Mail (Gmail)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Small-instance tuning; production profile overrides the defaults below.
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:2}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:4}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
app.notification-scheduler.delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:30000}
app.startup.data-initializer-enabled=${STARTUP_DATA_INITIALIZER_ENABLED:true}
app.startup.deployment-admin-initializer-enabled=${STARTUP_DEPLOYMENT_ADMIN_INITIALIZER_ENABLED:true}
app.schedulers.notification-enabled=${NOTIFICATION_SCHEDULER_ENABLED:true}
app.schedulers.order-reservation-enabled=${ORDER_RESERVATION_SCHEDULER_ENABLED:true}
app.schedulers.pos-reservation-enabled=${POS_RESERVATION_SCHEDULER_ENABLED:true}
app.order-reservation-cleanup-ms=${ORDER_RESERVATION_CLEANUP_MS:60000}
app.pos-reservation.cleanup-ms=${POS_RESERVATION_CLEANUP_MS:60000}

# Minimal operational health endpoint only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
