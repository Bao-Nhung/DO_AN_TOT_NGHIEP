spring.application.name=backend
# SQL Server. Production secrets must be supplied by Azure App Service settings.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=fashion_shop;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server/proxy
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# App URLs
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.payment-result-url=${APP_PAYMENT_RESULT_URL:http://localhost:5173/payment-result}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Uploaded images are local during development and Cloudinary in production.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:30MB}
app.media.storage=${MEDIA_STORAGE_PROVIDER:local}
app.media.local-root=${MEDIA_LOCAL_ROOT:../frontend/public/images}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

jwt.secret=${JWT_SECRET:zestia-fashion-secret-key-datn-fpt-polytechnic-2025}
app.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
google.oauth.client-id=${GOOGLE_CLIENT_ID:906678560911-vv9vu3jsqkvgu7og8mjg8to7lhh88odt.apps.googleusercontent.com}

# One-time bootstrap for the existing seed admin whose password is NULL in the public Azure SQL script.
